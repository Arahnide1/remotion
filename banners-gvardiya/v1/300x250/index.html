<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=300,height=250">
<title>ЖК «Гвардия» 300x250</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #banner { position: relative; width: 300px; height: 250px; overflow: hidden; background: #3b6fc4; font-family: Arial, Helvetica, sans-serif; }
  #click1_area { position: absolute; inset: 0; z-index: 10; display: block; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #blur { transform-origin: 50% 40%; animation: kb 2.4s cubic-bezier(.2,.7,.2,1) both; }
  #orig { opacity: 0; animation: fadeIn .7s ease-out 1.9s forwards; }
  .el { position: absolute; overflow: hidden; opacity: 0; will-change: transform, opacity; }
  .el img { display: block; width: 100%; height: 100%; }
  .el::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 60%;
    background: linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%);
    transform: translateX(-180%); animation: shine 4.5s ease-in-out 3s 6; }
  .logo  { animation: logoIn .7s cubic-bezier(.34,1.56,.64,1) .3s forwards; }
  .card1 { transform-origin: 0 50%; animation: cardIn .65s cubic-bezier(.34,1.45,.64,1) .75s forwards, pulse 4.5s ease-in-out 3.6s 6; }
  .card2 { animation: cardIn .65s cubic-bezier(.34,1.45,.64,1) 1.05s forwards; }
  .card2::after { animation-delay: 3.25s; }
  .logo::after { animation-delay: 3.5s; }
  .horiz .card1, .horiz .card2 { animation-name: cardUp; }
  .horiz .card1 { animation: cardUp .65s cubic-bezier(.34,1.45,.64,1) .75s forwards, pulse 4.5s ease-in-out 3.6s 6; }
  #disclaimer { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 1px 4px 2px; background: rgba(0,0,0,.6); color: #fff;
    font-size: 7.5px; line-height: 1.2; text-align: center; letter-spacing: 0; }
  @keyframes kb { from { transform: scale(1.14); } to { transform: scale(1); } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes logoIn { from { opacity: 0; transform: scale(.3) rotate(-14deg); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateX(-35%) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes cardUp { from { opacity: 0; transform: translateY(45%) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 22%, 100% { transform: none; } 11% { transform: scale(1.045); } }
  @keyframes shine { 0% { transform: translateX(-180%); } 30%, 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) {
    #blur, #orig, .el, .el::after { animation: none !important; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div id="banner" class="">
  <a id="click1_area" href="#" target="_blank" aria-label="ЖК «Гвардия»"></a>
  <img id="blur" class="layer" src="blur.jpg" alt="">
  <img id="orig" class="layer" src="bg.jpg" alt="">
    <div class="el logo" style="left:15px;top:15px;width:55px;height:58px;border-radius:17.1px"><img src="logo.png" alt=""></div>
    <div class="el card1" style="left:15px;top:110px;width:205px;height:50px;border-radius:15.6px"><img src="card1.png" alt=""></div>
    <div class="el card2" style="left:15px;top:187px;width:205px;height:50px;border-radius:15.6px"><img src="card2.png" alt=""></div>
  <div id="disclaimer">Проектная декларация на сайте наш.дом.рф. Застройщик ООО «СЗ Округ»</div>
</div>
<script>
  if (typeof yandexHTML5BannerApi !== "undefined") {
    document.getElementById("click1_area").href = yandexHTML5BannerApi.getClickURLNum(1);
  }
</script>
</body>
</html>
